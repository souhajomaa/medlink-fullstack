services:
  jenkins:
    build: .
    container_name: medlink-jenkins
    user: root
    restart: unless-stopped
    security_opt: ["label=disable"]
    ports: ["8080:8080"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/jenkins_workspace:/opt/jenkins_workspace
  sonarqube:
    image: sonarqube:community
    container_name: medlink-sonarqube
    restart: unless-stopped
    ports: ["9000:9000"]
    volumes:
      - sonar_data:/opt/sonarqube/data
volumes:
  jenkins_home:
  sonar_data: