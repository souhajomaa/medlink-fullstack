sonar.projectKey=medlink
sonar.sources=backend/src,frontend/src
sonar.tests=frontend/src
sonar.test.inclusions=**/*.test.jsx,**/*.test.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.jsx,**/*.old.jsx,**/seed.js
sonar.sourceEncoding=UTF-8

# Le moteur Node.js de l'analyse JS/TS était limité à 1024 Mo
sonar.javascript.node.maxspace=2048
sonar.scanner.javaOpts=-Xmx512m
