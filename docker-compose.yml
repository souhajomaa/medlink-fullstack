
services:
  # 1. Base de données
  db:
    image: postgres:16-alpine
    container_name: medlink-db
    environment:
      POSTGRES_USER: medlink
      POSTGRES_PASSWORD: medlink_secret
      POSTGRES_DB: medlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlink -d medlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend (Node.js)
  backend:
    build: ./backend
    container_name: medlink-backend
    env_file:
      - .env
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: medlink
      DB_PASSWORD: medlink_secret
      DB_NAME: medlink
      JWT_SECRET: medlink_super_secret_jwt_2026
      ALLOW_LEGACY_AUTH: "true"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8081
      KEYCLOAK_REALM: medlink
      KEYCLOAK_BACKEND_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  # 3. Frontend (React + Nginx)
  frontend:
    build: ./frontend
    container_name: medlink-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # 4. Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: medlink-keycloak
    command: start-dev --import-realm
    env_file:
      - .env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: "http://localhost:8081"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      KC_LOG_LEVEL: "INFO"
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak-theme/medlink:/opt/keycloak/themes/medlink
      - ./keycloak/import:/opt/keycloak/data/import:ro
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_data:
