apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: keycloak
          image: medlink-keycloak:latest
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: keycloak-config }
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: medlink-secrets, key: KEYCLOAK_ADMIN } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: medlink-secrets, key: KEYCLOAK_ADMIN_PASSWORD } }
            - name: KEYCLOAK_BACKEND_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: medlink-secrets, key: KEYCLOAK_BACKEND_CLIENT_SECRET } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: medlink-secrets, key: SMTP_USER } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: medlink-secrets, key: SMTP_PASSWORD } }
          startupProbe:
            httpGet: { path: /health/ready, port: 9000 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1536Mi }
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data/h2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-data