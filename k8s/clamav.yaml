apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clamav-db
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
spec:
  selector:
    app: clamav
  ports:
    - port: 3310
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clamav
  template:
    metadata:
      labels:
        app: clamav
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:stable
          ports:
            - containerPort: 3310
          startupProbe:
            tcpSocket: { port: 3310 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: 3310 }
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { memory: 3Gi }
          volumeMounts:
            - name: db
              mountPath: /var/lib/clamav
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: clamav-db