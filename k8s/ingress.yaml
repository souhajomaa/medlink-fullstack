apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medlink-app
spec:
  ingressClassName: nginx
  tls:
    - hosts: [medlink.local, mailpit.medlink.local]
      secretName: medlink-tls
  rules:
    - host: medlink.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 4000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
    - host: mailpit.medlink.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: mailpit, port: { number: 8025 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medlink-keycloak
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [keycloak.medlink.local]
      secretName: medlink-tls
  rules:
    - host: keycloak.medlink.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: keycloak, port: { number: 8080 } }